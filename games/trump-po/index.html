<canvas id="game" tabindex="0" aria-label="Game Cuộc Phiêu Lưu Anh Em Nhà Trump-Po. Trump dùng W A S D, F, G. Poly dùng phím mũi tên, Enter, Shift phải."></canvas>
<script>
(() => {
'use strict';
// ============================================================
//  CUỘC PHIÊU LƯU ANH EM NHÀ TRUMP-PO
//  Game co-op pixel: Trump (11 tuổi) & Poly (6 tuổi) trên đảo rồng
// ============================================================
const W = 320, H = 180, TS = 16;
// NX = running on Nintendo Switch homebrew (nx.js runtime) instead of a browser
const NX = typeof Switch !== 'undefined' && typeof screen !== 'undefined' && typeof document === 'undefined';
const FONT = NX ? 'VT323' : "'VT323', ui-monospace, monospace";
function mkCanvas(w, h) { if (NX) return new OffscreenCanvas(w, h); const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const hasFocus = () => NX || document.hasFocus();
const cv = NX ? screen : document.getElementById('game');
const g = cv.getContext('2d');
const buf = mkCanvas(W, H);
const b = buf.getContext('2d');
let S = 1;

function resize() {
  if (NX) { S = Math.min(screen.width / W, screen.height / H); return; }
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const ratio = Math.min(innerWidth / W, innerHeight / H);
  let ds = Math.floor(ratio * dpr);
  if (ds < 1) ds = ratio * dpr;
  S = ds;
  cv.width = Math.round(W * ds); cv.height = Math.round(H * ds);
  cv.style.width = (W * ds / dpr) + 'px'; cv.style.height = (H * ds / dpr) + 'px';
}
if (!NX) addEventListener('resize', resize); resize();

// ---------------- utils
const clamp = (v, a, c) => v < a ? a : v > c ? c : v;
const dist = (a, c) => Math.hypot(a.x - c.x, a.y - c.y);
const rnd = (a, c) => a + Math.random() * (c - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function makeRng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

// ---------------- input
const keys = {}; let pressed = {};
const BLOCK = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Enter','Slash','ShiftRight','Tab'];
if (!NX) addEventListener('keydown', e => {
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  if (BLOCK.includes(e.code)) e.preventDefault();
  initAudio();
});
if (!NX) {
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
  cv.addEventListener('pointerdown', () => { cv.focus(); initAudio(); });
}
// Switch controllers -> the same virtual key codes the keyboard uses.
// Controller 1 = Trump, controller 2 = Poly. A/B attack, X/Y special, + pause, - mute (or quit from pause).
const PADMAP = [
  { up: 'KeyW', down: 'KeyS', left: 'KeyA', right: 'KeyD', atk: 'KeyF', sp: 'KeyG' },
  { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight', atk: 'Enter', sp: 'ShiftRight' }
];
const padPrev = {};
function setVKey(code, on) { if (on && !padPrev[code]) pressed[code] = true; if (on !== !!padPrev[code]) keys[code] = on; padPrev[code] = on; }
function pollPads() {
  if (!NX || !navigator.getGamepads) return;
  const pads = Array.from(navigator.getGamepads()).filter(Boolean);
  const want = {};
  pads.slice(0, 2).forEach((pad, i) => {
    const m = PADMAP[i], bt = k => !!(pad.buttons[k] && pad.buttons[k].pressed), ax = k => pad.axes[k] || 0;
    const or = (code, v) => { want[code] = want[code] || v; };
    or(m.up, bt(12) || ax(1) < -0.45); or(m.down, bt(13) || ax(1) > 0.45);
    or(m.left, bt(14) || ax(0) < -0.45); or(m.right, bt(15) || ax(0) > 0.45);
    or(m.atk, bt(0) || bt(1)); or(m.sp, bt(2) || bt(3));
    or('Escape', bt(9));
    or(state === 'paused' ? 'KeyQ' : 'KeyM', bt(8));
  });
  for (const code of ['KeyW', 'KeyS', 'KeyA', 'KeyD', 'KeyF', 'KeyG', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'ShiftRight', 'Escape', 'KeyM', 'KeyQ']) setVKey(code, !!want[code]);
  if (pads.length) initAudio();
}
if (NX) {
  // On nx.js any uncaught error or rejected promise stops the frame loop for good. Catch them all and keep running.
  addEventListener('error', e => { e.preventDefault(); reportError(e.error || e.message || e); });
  addEventListener('unhandledrejection', e => { e.preventDefault(); reportError(e.reason); });

  addEventListener('beforeunload', e => { if (state !== 'title') e.preventDefault(); });
}
const held = a => a.some(k => keys[k]);
const tap = a => a.some(k => pressed[k]);
const CTRL = {
  trump: { up:['KeyW'], down:['KeyS'], left:['KeyA'], right:['KeyD'], atk:['KeyF','Space'], sp:['KeyG'] },
  poly:  { up:['ArrowUp'], down:['ArrowDown'], left:['ArrowLeft'], right:['ArrowRight'], atk:['Enter','NumpadEnter','KeyL','Period'], sp:['ShiftRight','KeyK','Slash'] }
};
const CONFIRM = ['Enter','Space','KeyF','KeyL','NumpadEnter'];

// ---------------- audio (chiptune)
let AC = null, master = null, muted = false, audioOff = false, SYNTH = false;
function audioFail(e) { console.error('audio disabled:', e); AC = null; audioOff = true; }
function initAudio() {
  if (audioOff) return;
  if (AC) { try { if (AC.state === 'suspended' && AC.resume) AC.resume(); } catch (e) {} return; }
  try {
    AC = new (globalThis.AudioContext || globalThis.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    nextNoteT = AC.currentTime + 0.1;

const synthCache = new Map();
function synthBuf(f, d, type, v, f2) {

  let bf = synthCache.get(key); if (bf) return bf;
  const sr = AC.sampleRate, n = Math.max(1, Math.floor(sr * d)), k = Math.log(0.001) / n;
  bf = AC.createBuffer(1, n, sr); const da = bf.getChannelData(0); let ph = 0;
  for (let i = 0; i < n; i++) {
    const fr = f2 ? f * Math.pow(f2 / f, i / n) : f; ph += 2 * Math.PI * fr / sr;
    const sn = Math.sin(ph);
    const w = type === 'square' ? (sn >= 0 ? 1 : -1) : type === 'sawtooth' ? ((ph / Math.PI) % 2) - 1 : type === 'triangle' ? 2 / Math.PI * Math.asin(sn) : sn;
    da[i] = w * v * Math.exp(k * i);

}
function playBuf(bf, t) { const s = AC.createBufferSource(); s.buffer = bf; s.connect(master); s.start(t); }
function tone(f, d = 0.1, type = 'square', v = 0.12, f2 = null, delay = 0) {
  if (!AC || muted) return;
  if (SYNTH) { try { playBuf(synthBuf(f, d, type, v, f2), AC.currentTime + delay); } catch (e) { audioFail(e); } return; }
  const t = AC.currentTime + delay;
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + d + 0.02);
}
function noise(d = 0.1, v = 0.15) {
  if (!AC || muted) return;
  try { noiseRaw(d, v); } catch (e) { audioFail(e); }
}
function noiseRaw(d, v) {
  const n = Math.floor(AC.sampleRate * d), bf = AC.createBuffer(1, n, AC.sampleRate), da = bf.getChannelData(0);
  for (let i = 0; i < n; i++) da[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), gn = AC.createGain(); s.buffer = bf; gn.gain.value = v;
  s.connect(gn); gn.connect(master); s.start();
}
const SFX = {
  swing: () => tone(700, 0.08, 'triangle', 0.12, 200),
  shoot: () => tone(900, 0.06, 'square', 0.06, 1500),
  hit: () => { noise(0.07, 0.14); tone(220, 0.08, 'square', 0.08, 90); },
  hurt: () => tone(320, 0.22, 'sawtooth', 0.1, 80),
  pick: () => { tone(880, 0.07, 'square', 0.07); tone(1320, 0.1, 'square', 0.07, null, 0.07); },
  food: () => [523, 659, 784].forEach((f, i) => tone(f, 0.08, 'triangle', 0.12, null, i * 0.06)),
  heal: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'sine', 0.12, null, i * 0.07)),
  gate: () => [392, 523, 659, 784, 1047].forEach((f, i) => tone(f, 0.16, 'square', 0.07, null, i * 0.09)),
  roar: () => { noise(0.9, 0.22); tone(140, 0.9, 'sawtooth', 0.14, 45); },
  fire: () => { noise(0.12, 0.06); tone(300, 0.1, 'sawtooth', 0.04, 120); },
  down: () => tone(420, 0.5, 'triangle', 0.14, 90),
  revive: () => [392, 494, 587, 784].forEach((f, i) => tone(f, 0.1, 'square', 0.07, null, i * 0.06)),
  spin: () => tone(260, 0.35, 'sawtooth', 0.05, 900),
  blip: () => tone(640 + Math.random() * 80, 0.025, 'square', 0.025),
  boom: () => { noise(0.35, 0.2); tone(110, 0.3, 'square', 0.1, 40); },
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.16, 'square', 0.08, null, i * 0.11)),
  menu: () => tone(520, 0.04, 'square', 0.05)
};
// music sequencer
const SONGS = {
  title:   { bpm: 108, lead: [72,null,76,79,81,79,76,null,74,null,77,81,79,null,null,null,72,null,76,79,84,83,81,79,77,76,74,72,74,null,null,null],
             bass: [48,null,55,null,53,null,57,null,50,null,55,null,55,null,43,null,48,null,55,null,53,null,57,null,50,null,55,null,48,null,43,null] },
  explore: { bpm: 138, lead: [72,null,76,79,77,76,74,null,72,74,76,72,69,null,67,null,69,72,74,76,77,76,74,72,74,null,71,67,72,null,null,null],
             bass: [48,null,55,null,53,null,55,null,48,null,55,null,45,null,52,null,41,null,48,null,43,null,50,null,43,null,47,null,48,null,43,null] },
  boss:    { bpm: 168, lead: [69,72,76,72,69,72,76,77,76,74,72,71,72,null,69,null,67,71,74,71,67,71,74,76,74,72,71,69,71,null,64,null],
             bass: [45,45,57,45,45,45,57,45,41,41,53,41,41,41,53,41,43,43,55,43,43,43,55,43,40,40,52,40,40,40,52,40] }
};
let song = null, songName = '', songStep = 0, nextNoteT = 0;
function playSong(n) { if (songName === n) return; songName = n; song = SONGS[n]; songStep = 0; if (AC) nextNoteT = AC.currentTime + 0.05; }
function note(m, d, type, v, t) {
  const f = 440 * Math.pow(2, (m - 69) / 12);
  if (SYNTH) { playBuf(synthBuf(f, d, type, v, null), t); return; }
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.value = f;
  gn.gain.setValueAtTime(v, t); gn.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(gn); gn.connect(master); o.start(t); o.stop(t + d + 0.02);

function musicTick() {
  if (!AC || !song || muted) return;
  const spb = 60 / song.bpm / 2;
  if (nextNoteT < AC.currentTime) nextNoteT = AC.currentTime + 0.02;
  while (nextNoteT < AC.currentTime + 0.15) {
    const n = song.lead[songStep % song.lead.length];
    if (n != null) note(n, spb * 0.85, 'square', 0.028, nextNoteT);
    const bn = song.bass[songStep % song.bass.length];
    if (bn != null) note(bn, spb * 0.9, 'triangle', 0.07, nextNoteT);
    nextNoteT += spb; songStep++;

// ---------------- text (drawn crisp on the display canvas)
let TQ = [];
function T(s, x, y, size = 10, col = '#fff', align = 'left', sh = '#1a0f2a') { TQ.push([s, x, y, size, col, align, sh]); }
function flushText() {
  g.textBaseline = 'top';
  for (const [s, x, y, size, col, align, sh] of TQ) {
    g.font = `${Math.round(size * S)}px ${FONT}`; g.textAlign = align;
    const X = Math.round(x * S), Y = Math.round(y * S);
    if (sh) { g.fillStyle = sh; const o = Math.max(1, Math.round(S * 0.6)); g.fillText(s, X + o, Y + o); }
    g.fillStyle = col; g.fillText(s, X, Y);
  }
  TQ = [];
}
function measure(s, size) { g.font = `${Math.round(size * S)}px ${FONT}`; return g.measureText(s).width / S; }
function wrap(s, maxW, size) {
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (measure(t, size) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}

// ---------------- pixel helpers
function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function panel(x, y, w, h, alpha = 0.9, bg = '#1d1430') {
  b.globalAlpha = alpha; R(b, x + 1, y + 1, w - 2, h - 2, bg); b.globalAlpha = 1;
  R(b, x + 1, y, w - 2, 1, '#f4e3c1'); R(b, x + 1, y + h - 1, w - 2, 1, '#f4e3c1');
  R(b, x, y + 1, 1, h - 2, '#f4e3c1'); R(b, x + w - 1, y + 1, 1, h - 2, '#f4e3c1');
  R(b, x + 1, y + 1, w - 2, 1, '#5a3f7a');
}
const HEART = ['.xx.xx.', 'xxxxxxx', 'xxxxxxx', '.xxxxx.', '..xxx..', '...x...'];
function drawHeart(c, x, y, fill = 1, col = '#ff4d6d') {
  for (let j = 0; j < 6; j++) for (let i = 0; i < 7; i++) if (HEART[j][i] === 'x') {
    const on = fill >= 1 || (fill > 0 && i < 4);
    R(c, x + i, y + j, 1, 1, on ? col : '#4a3558');

  if (fill > 0) R(c, x + 1, y + 1, 1, 1, '#ffd1dc');
}
function pixEllipse(c, cx, cy, rx, ry, col) {
  c.fillStyle = col;
  for (let a = 0; a < Math.PI * 2; a += 0.12) c.fillRect(Math.round(cx + Math.cos(a) * rx), Math.round(cy + Math.sin(a) * ry), 1, 1);
}

// ---------------- characters
const OL = '#2a1a2e', SK = '#ffd9b3', SKD = '#eeb489', BL = '#ff9aa2';

      r(-4, -18, 1, 1, '#fff'); r(3, -18, 1, 1, '#fff'); r(-4, -17, 1, 1, OL); r(3, -17, 1, 1, OL);
      r(-4, -14, 1, 1, '#fff'); r(-2, -14, 1, 1, '#fff'); r(1, -14, 1, 1, '#fff'); r(3, -14, 1, 1, '#fff');
      r(-3, -12, 2, 2, OL); r(1, -12, 2, 2, OL); r(-3, -12, 1, 1, '#fff'); r(1, -12, 1, 1, '#fff');

function genZone(i) {

    for (let y = by - ry; y <= by + ry; y++) for (let x = bx - rx; x <= bx + rx; x++) {

  for (let y = 0; y < h; y++) { const bk = sea ? WA : O; Sx(0, y, bk); Sx(1, y, bk); Sx(w - 1, y, bk); Sx(w - 2, y, bk); }
  for (let y = 0; y < 3; y++) for (let x = 2; x < w - 2; x++) Sx(x, y, (y < 2) ? ((x >= mid - 2 && x <= mid + 1) ? EX : O) : G);
  for (let x = 2; x < w - 2; x++) Sx(x, 3, GT);
  for (let y = 4; y < 7; y++) for (let x = 2; x < w - 2; x++) Sx(x, y, G);

  else for (let y = h - 2; y < h; y++) for (let x = 0; x < w; x++) Sx(x, y, O);

}
function genArena() {
  const w = 20, h = 14, t = new Array(w * h).fill(G), v = [];
  const Rn = makeRng(555);
  for (let k = 0; k < w * h; k++) { v.push(Math.floor(Rn() * 4)); if (Rn() < 0.08) t[k] = DC; }
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (x === 0 || y <= 1 || x === w - 1 || y === h - 1) t[y * w + x] = O;

const D4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function reach(m, sx, sy) {
  const seen = new Uint8Array(m.w * m.h), q = [sy * m.w + sx]; seen[q[0]] = 1;

    if (avoid.some(a => Math.hypot(a.x - p.x, a.y - p.y) < minD)) { if (tries < 2000) continue; }
    res.push(p); avoid.push(p);
  }
  return res;
}

function tileAt(px, py) {
  const tx = Math.floor(px / TS), ty = Math.floor(py / TS);
  if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return O;
  return map.t[ty * map.w + tx];
}
function blocked(x, y, hw, hh) {
  const x0 = Math.floor((x - hw) / TS), x1 = Math.floor((x + hw - 0.01) / TS), y0 = Math.floor((y - hh) / TS), y1 = Math.floor((y - 0.01) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (tx < 0 || ty < 0 || tx >= map.w || ty >= map.h) return true;
    if (isSolid(map.t[ty * map.w + tx])) return true;
  }
  return false;
}
function moveEnt(e, dx, dy) {
  if (e.fly) { e.x = clamp(e.x + dx, 36, map.w * 16 - 36); e.y = clamp(e.y + dy, 72, map.h * 16 - 24); return; }
  let hitW = false;
  if (dx) { if (!blocked(e.x + dx, e.y, e.hw, e.hh)) e.x += dx; else hitW = true; }
  if (dy) { if (!blocked(e.x, e.y + dy, e.hw, e.hh)) e.y += dy; else hitW = true; }
  return hitW;
}
function movePlayer(p, dx, dy) {

  if (dx) { const nx = p.x + dx; if (!blocked(nx, p.y, p.hw, p.hh) && (Math.abs(nx - o.x) <= W - 18 || Math.abs(nx - o.x) < Math.abs(p.x - o.x))) p.x = nx; }
  if (dy) { const ny = p.y + dy; if (!blocked(p.x, ny, p.hw, p.hh) && (Math.abs(ny - o.y) <= H - 44 || Math.abs(ny - o.y) < Math.abs(p.y - o.y))) p.y = ny; }
}

function addParts(x, y, n, cols, spd = 60, life = 0.5, grav = 0, sz = 1) {
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = Math.random() * spd; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: life * (0.6 + Math.random() * 0.6), max: life, col: pick(cols), g: grav, sz }); }
}

function hurtPlayer(p, d, fx, fy) {
  if (p.inv > 0 || p.down || state !== 'play') return;
  p.hp -= d; p.inv = 1.1;
  const dx = p.x - fx, dy = p.y - fy, l = Math.hypot(dx, dy);
  if (l > 0.1) { p.kx = dx / l * 150; p.ky = dy / l * 150; }
  SFX.hurt(); shake = Math.max(shake, 3);
  addFloat(p.x, p.y - 24, '-' + d, '#ff6b7a');
  addParts(p.x, p.y - 10, 6, ['#ff4d6d', '#fff'], 50, 0.35);
  if (p.hp <= 0) {
    p.hp = 0; p.down = true; p.reviveT = 0; SFX.down();

    say(other.down ? '' : `${p.name} bị ngã! ${other.name} ơi, đứng sát bên để cứu!`, 3.5);
