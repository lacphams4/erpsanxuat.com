<!doctype html>
<html lang="vi" data-chapter="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TRUMBO</title>
<style>
@font-face{font-family:'VT323';src:url(fonts/VT323.ttf) format('truetype');font-display:block}
@font-face{font-family:'TrumboCJK';src:url(fonts/cjk.woff2) format('woff2');unicode-range:U+2E80-9FFF,U+F900-FAFF,U+FE30-FE4F,U+FF00-FFEF;size-adjust:82%;font-display:block}
/* Home screen: pixel-art backdrop from Part 1, menu on a dark panel. Single dark look like the game itself. */
:root{
  --ink:#120c1c;--panel:#1d1430;--line:#f4e3c1;--gold:#ffd23f;--pink:#b5179e;--lilac:#c9b8e8;--violet:#4a2f7a;
  --font:'VT323','TrumboCJK',ui-monospace,monospace;
  --u:min(1vh,0.6vw);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:#fff;font-family:var(--font);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;background:#2a1a4a url(art/title.png) center/cover no-repeat;image-rendering:pixelated}
#bg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,12,28,.92) 0%,rgba(18,12,28,.75) 38%,rgba(18,12,28,0) 62%)}
main{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(2.5*var(--u)) calc(4*var(--u)) calc(2.5*var(--u)) max(calc(6*var(--u)),env(safe-area-inset-left));max-width:72vw}
h1{margin:0;font-weight:normal;line-height:.85;color:var(--gold);font-size:calc(13*var(--u));white-space:nowrap;text-shadow:0 calc(.8*var(--u)) 0 #7a1f5a}
h1 small{display:block;font-size:.42em;color:#fff;text-shadow:0 calc(.5*var(--u)) 0 #4a1f6a;letter-spacing:.06em}
.sub{margin:calc(1*var(--u)) 0 calc(2.2*var(--u));font-size:calc(4.8*var(--u));color:var(--lilac);max-width:calc(120*var(--u))}
nav{display:flex;flex-direction:column;gap:calc(1.2*var(--u));align-items:flex-start}
.small{display:flex;gap:calc(1.5*var(--u));flex-wrap:wrap}
.m.s{min-width:0;font-size:calc(4.8*var(--u));padding:calc(.2*var(--u)) calc(2*var(--u))}
button,input{font:inherit;color:#fff}
button{cursor:pointer}
.m{font-size:calc(5.8*var(--u));white-space:nowrap;padding:calc(.3*var(--u)) calc(3*var(--u));background:var(--panel);border:calc(.5*var(--u)) solid var(--line);border-radius:calc(1*var(--u));min-width:calc(62*var(--u));text-align:left;box-shadow:0 calc(.8*var(--u)) 0 #000}
.m.main{background:var(--pink);font-size:calc(7*var(--u))}
.m small{color:var(--lilac);font-size:.7em;margin-left:calc(2*var(--u))}
.m.main small{color:#ffe1f3}
.m:focus-visible,.m.focus,.seg button:focus-visible{outline:calc(.6*var(--u)) solid var(--gold);outline-offset:calc(.4*var(--u))}
.m:active{transform:translateY(calc(.5*var(--u)))}
.row2{display:flex;flex-wrap:wrap;align-items:center;gap:calc(1*var(--u)) calc(3*var(--u));margin-top:calc(2*var(--u));font-size:calc(4.8*var(--u))}
.opt{display:flex;align-items:center;gap:calc(1.2*var(--u))}
.seg{display:flex;border:calc(.5*var(--u)) solid var(--line);border-radius:calc(1*var(--u));overflow:hidden}
.seg button{font-size:calc(4.8*var(--u));padding:calc(.2*var(--u)) calc(2*var(--u));background:var(--panel);border:0}
.seg button.on{background:var(--gold);color:var(--ink)}
.status{margin-top:calc(1.8*var(--u));font-size:calc(4.4*var(--u));color:var(--lilac)}
.status b{color:var(--gold);font-weight:normal}
/* modal panels */
.panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,6,20,.78);z-index:5}
.panel.open{display:flex}
.box{background:var(--panel);border:calc(.6*var(--u)) solid var(--line);border-radius:calc(1*var(--u));padding:calc(3*var(--u)) calc(4*var(--u));width:min(92vw,calc(170*var(--u)));max-height:92vh;overflow:auto;touch-action:pan-y}
.box h2{margin:0 0 calc(2*var(--u));font-weight:normal;color:var(--gold);font-size:calc(9*var(--u))}
.box p,.box li{font-size:calc(5.2*var(--u));line-height:1.15;margin:0 0 calc(1.2*var(--u))}
.box ul{margin:0;padding-left:1.2em}
.box .k{color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(2*var(--u))}
.card{white-space:normal;align-self:stretch;background:#2a1f45;border:calc(.5*var(--u)) solid var(--line);border-radius:calc(1*var(--u));padding:calc(2*var(--u));text-align:left;font-size:calc(5*var(--u))}
.card b{display:block;color:var(--gold);font-weight:normal;font-size:1.1em}
.card span{display:block;font-size:1.35em;line-height:1}
.card i{display:block;font-style:normal;color:var(--lilac);margin-top:calc(1*var(--u))}
.card[disabled]{opacity:.4}
.names{display:grid;grid-template-columns:auto 1fr;gap:calc(1.6*var(--u)) calc(3*var(--u));align-items:center;font-size:calc(5.4*var(--u))}
.names label span{display:block;color:var(--lilac);font-size:.75em}
.names input{font-size:calc(7*var(--u));width:100%;padding:calc(.4*var(--u)) calc(2*var(--u));background:#0d0816;border:calc(.5*var(--u)) solid var(--line);border-radius:calc(1*var(--u));-webkit-user-select:text;user-select:text}
.names input:focus{outline:calc(.6*var(--u)) solid var(--gold)}
.hint{font-size:calc(4.4*var(--u));color:var(--lilac);margin-top:calc(1.4*var(--u))}
.row{display:flex;flex-wrap:wrap;gap:calc(2*var(--u));justify-content:flex-end;margin-top:calc(2.5*var(--u))}
.row button{font-size:calc(6*var(--u));padding:calc(.5*var(--u)) calc(3*var(--u));background:var(--violet);border:calc(.5*var(--u)) solid var(--line);border-radius:calc(1*var(--u))}
.row button.go{background:var(--pink)}
.row .left{margin-right:auto}
.done{position:fixed;right:calc(4*var(--u));bottom:calc(4*var(--u));font-size:calc(6*var(--u));color:var(--gold);background:rgba(18,12,28,.8);border:calc(.5*var(--u)) solid var(--gold);padding:calc(.5*var(--u)) calc(2.5*var(--u));border-radius:calc(1*var(--u));display:none}
.done.show{display:block}
</style>
</head>
<body>
<div id="bg"></div>
<main>
  <h1><small data-t="kicker"></small><span data-t="title"></span></h1>
  <div class="sub" id="sub"></div>
  <nav id="menu">
    <button class="m main" id="bContinue"><span data-t="continue"></span> <small id="contLbl"></small></button>
    <button class="m" id="bNew" data-t="newGame"></button>
    <button class="m" id="bChapters" data-t="chapters"></button>
    <div class="small">
      <button class="m s" id="bNames" data-t="names"></button>
      <button class="m s" id="bHelp" data-t="help"></button>
      <button class="m s" id="bAbout" data-t="about"></button>
    </div>
  </nav>
  <div class="row2">
    <div class="opt"><span data-t="players"></span>
      <div class="seg" id="seg"><button data-m="1" data-t="p1"></button><button data-m="2" data-t="p2"></button></div>
    </div>
    <div class="opt"><span data-t="language"></span>
      <div class="seg" id="langs"><button data-l="vi">Tiếng Việt</button><button data-l="en">English</button><button data-l="zh">中文</button></div>
    </div>
  </div>
  <div class="status" id="status"></div>
</main>
<div class="done" id="done" data-t="doneAll"></div>

<div class="panel" id="pChapters"><div class="box">
  <h2 data-t="chapters"></h2>
  <div class="cards" id="cards"></div>
  <div class="row"><button data-close data-t="close"></button></div>
</div></div>

<div class="panel" id="pNew"><div class="box">
  <h2 data-t="newQ"></h2>
  <p data-t="newText"></p>
  <div class="row"><button data-close data-t="cancel"></button><button class="go" id="bNewGo" data-t="start"></button></div>
</div></div>

<div class="panel" id="pNames"><div class="box">
  <h2 data-t="names"></h2>
  <div class="names">
    <label for="nTrump"><span data-t="bigRole"></span><b data-t="bigLabel"></b></label><input id="nTrump" maxlength="10" autocomplete="off" spellcheck="false">
    <label for="nPoly"><span data-t="smallRole"></span><b data-t="smallLabel"></b></label><input id="nPoly" maxlength="10" autocomplete="off" spellcheck="false">
  </div>
  <div class="hint" data-t="namesHint"></div>
  <div class="row"><button class="left" id="bNamesReset" data-t="reset"></button><button data-close data-t="cancel"></button><button class="go" id="bNamesSave" data-t="save"></button></div>
</div></div>

<div class="panel" id="pHelp"><div class="box">
  <h2 data-t="help"></h2>
  <div id="helpBody"></div>
  <div class="row"><button data-close data-t="close"></button></div>
</div></div>

<div class="panel" id="pAbout"><div class="box">
  <h2 data-t="about"></h2>
  <div id="aboutBody"></div>
  <div class="row"><button data-close data-t="close"></button></div>
</div></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
<script>
(() => {
'use strict';
const APP = window.TRUMBO_APP, CH = APP.CHAPTERS;
const TXT = {
  vi: {
    kicker: 'CUỘC PHIÊU LƯU', title: 'ANH EM NHÀ TRUMBO', sub: '{T}, {P} và chú chó Pugi - 3 phần phiêu lưu',
    continue: '▶ Chơi tiếp', newGame: 'Chơi mới', chapters: 'Chọn phần', names: 'Đặt tên nhân vật', help: 'Cách chơi', about: 'Giới thiệu',
    players: 'Người chơi:', p1: '1 người', p2: '2 người', language: 'Ngôn ngữ:',
    status: 'Đã mở: <b>{n}/3 phần</b>', playing: 'Đang chơi: <b>{c}</b>', doneAll: '★ ĐÃ HOÀN THÀNH CẢ 3 PHẦN ★',
    passed: '✓ Đã qua', current: 'Đang chơi', locked: 'Chưa mở',
    close: 'Đóng', cancel: 'Thôi', start: 'Bắt đầu', save: 'Lưu', reset: 'Về tên gốc',
    newQ: 'Chơi mới?', newText: 'Bắt đầu lại từ Phần 1. Các phần đã mở vẫn được giữ, có thể chọn lại bất cứ lúc nào.',
    bigRole: 'Anh lớn · đánh gần', bigLabel: 'Nhân vật 1', smallRole: 'Em nhỏ · bắn xa, hồi máu', smallLabel: 'Nhân vật 2',
    namesHint: 'Tối đa 10 ký tự. Tên mới hiện trong lời thoại và trên thanh máu. Chú chó vẫn tên là Pugi.',
    help: 'Cách chơi',
    helpBody: `<p><span class="k">{T}</span> đánh gần bằng kiếm. <span class="k">{P}</span> bắn từ xa và thổi bong bóng hồi máu. Từ Phần 2 có thêm chú chó <span class="k">Pugi</span> do máy điều khiển: cắn, sủa, nhử quái, đánh hơi và cứu chủ.</p><ul>
      <li><span class="k">Màn hình cảm ứng:</span> kéo ngón tay ở nửa trái để di chuyển. <span class="k">A</span> đánh / xác nhận, <span class="k">X</span> chiêu đặc biệt, <span class="k">L/R</span> đổi vũ khí, <span class="k">+</span> tạm dừng, <span class="k">−</span> tắt nhạc (khi tạm dừng: lưu và về màn hình chính).</li>
      <li><span class="k">2 người trên 1 máy:</span> nửa trái màn hình là {T}, nửa phải là {P}. Máy tính bảng sẽ dễ chơi hơn.</li>
      <li><span class="k">Tay cầm Bluetooth:</span> tay cầm 1 là {T}, tay cầm 2 là {P}. Nút cảm ứng tự ẩn khi có tay cầm.</li>
      <li><span class="k">Bàn phím:</span> {T} dùng W A S D, F đánh, G chiêu, R đổi vũ khí. {P} dùng mũi tên, Enter, Shift phải, J. P tạm dừng.</li>
      <li>Một người ngã thì người kia đứng sát bên để cứu dậy. Chơi 1 người thì máy điều khiển {P}.</li></ul>`,
    aboutBody: `<p>Hai anh em <span class="k">{T}</span> và <span class="k">{P}</span> bị bão cuốn tới xứ sở rồng. Hỏa Long Vương tặng hai bạn Ngọc La Bàn để tìm đường về nhà, nhưng lời nguyền của Ác Quỷ đã làm la bàn chỉ sai đường...</p>
      <p>Ý tưởng và kịch bản: <span class="k">Trump</span> (11 tuổi). Thực hiện: S4 Family.</p>
      <p>Miễn phí, không quảng cáo, không thu thập dữ liệu, chơi không cần mạng.</p>
      <p>Phông chữ VT323 và Fusion Pixel (SIL Open Font License).</p>`
  },
  en: {
    kicker: 'THE ADVENTURES OF', title: 'TRUMBO', sub: '{T}, {P} and Pugi the dog in 3 adventures',
    continue: '▶ Continue', newGame: 'New game', chapters: 'Choose a part', names: 'Name the heroes', help: 'How to play', about: 'About',
    players: 'Players:', p1: '1 player', p2: '2 players', language: 'Language:',
    status: 'Unlocked: <b>{n}/3 parts</b>', playing: 'Now playing: <b>{c}</b>', doneAll: '★ ALL 3 PARTS COMPLETE ★',
    passed: '✓ Completed', current: 'Now playing', locked: 'Locked',
    close: 'Close', cancel: 'Cancel', start: 'Start', save: 'Save', reset: 'Original names',
    newQ: 'New game?', newText: 'Start again from Part 1. Unlocked parts stay unlocked, and you can pick them any time.',
    bigRole: 'Big brother · close combat', bigLabel: 'Hero 1', smallRole: 'Little one · ranged, heals', smallLabel: 'Hero 2',
    namesHint: 'Up to 10 letters. The new names appear in the story and on the health bars. The dog stays Pugi.',
    helpBody: `<p><span class="k">{T}</span> fights up close with a sword. <span class="k">{P}</span> shoots from afar and blows healing bubbles. From Part 2, <span class="k">Pugi</span> the dog joins in (computer controlled): he bites, barks, lures monsters, sniffs out secrets and rescues the kids.</p><ul>
      <li><span class="k">Touch screen:</span> drag on the left half to move. <span class="k">A</span> attack / confirm, <span class="k">X</span> special move, <span class="k">L/R</span> switch weapon, <span class="k">+</span> pause, <span class="k">−</span> music off (when paused: save and go to the main menu).</li>
      <li><span class="k">2 players on one device:</span> the left half of the screen is {T}, the right half is {P}. Easier on a tablet.</li>
      <li><span class="k">Bluetooth controllers:</span> controller 1 is {T}, controller 2 is {P}. Touch buttons hide when a controller is connected.</li>
      <li><span class="k">Keyboard:</span> {T} uses W A S D, F attack, G special, R switch weapon. {P} uses the arrows, Enter, Right Shift, J. P pauses.</li>
      <li>If one hero falls, the other stands close by to help them up. In 1-player mode the computer plays {P}.</li></ul>`,
    aboutBody: `<p><span class="k">{T}</span> and <span class="k">{P}</span> are swept by a storm to the land of dragons. The Fire Dragon King gives them the Compass Orb to find their way home, but the Demon's curse makes it point the wrong way...</p>
      <p>Story and ideas by <span class="k">Trump</span>, age 11. Made by S4 Family.</p>
      <p>Free, no ads, no data collected, plays offline.</p>
      <p>Fonts: VT323 and Fusion Pixel (SIL Open Font License).</p>`
  },
  zh: {
    kicker: '冒险故事', title: 'TRUMBO', sub: '{T}、{P}和小狗Pugi的三部曲冒险',
    continue: '▶ 继续游戏', newGame: '新游戏', chapters: '选择章节', names: '给主角起名', help: '玩法', about: '关于',
    players: '玩家：', p1: '1人', p2: '2人', language: '语言：',
    status: '已解锁：<b>{n}/3部</b>', playing: '正在玩：<b>{c}</b>', doneAll: '★ 已通关全部三部 ★',
    passed: '✓ 已通关', current: '正在玩', locked: '未解锁',
    close: '关闭', cancel: '取消', start: '开始', save: '保存', reset: '恢复原名',
    newQ: '开始新游戏？', newText: '从第一部重新开始。已解锁的章节会保留，随时都可以选择。',
    bigRole: '哥哥 · 近战', bigLabel: '主角1', smallRole: '小家伙 · 远程、治疗', smallLabel: '主角2',
    namesHint: '最多10个字。新名字会出现在剧情和血条上。小狗还是叫Pugi。',
    helpBody: `<p><span class="k">{T}</span>用剑近战。<span class="k">{P}</span>远程射击，还会吹治疗泡泡。从第二部开始，小狗<span class="k">Pugi</span>加入（电脑控制）：会咬、会叫、引诱怪物、嗅出秘密，还会救主人。</p><ul>
      <li><span class="k">触屏：</span>在屏幕左半边拖动来移动。<span class="k">A</span>攻击/确认，<span class="k">X</span>特技，<span class="k">L/R</span>切换武器，<span class="k">+</span>暂停，<span class="k">−</span>关闭音乐（暂停时：存档并返回主菜单）。</li>
      <li><span class="k">一台设备两人玩：</span>屏幕左半边是{T}，右半边是{P}。用平板会更方便。</li>
      <li><span class="k">蓝牙手柄：</span>1号手柄是{T}，2号手柄是{P}。连接手柄后触屏按钮会自动隐藏。</li>
      <li><span class="k">键盘：</span>{T}用W A S D、F攻击、G特技、R切换武器。{P}用方向键、Enter、右Shift、J。P暂停。</li>
      <li>一个人倒下，另一个人站到旁边就能把他救起来。单人模式下由电脑控制{P}。</li></ul>`,
    aboutBody: `<p><span class="k">{T}</span>和<span class="k">{P}</span>被暴风雨卷到了龙之国度。火龙王送给他们罗盘宝珠来寻找回家的路，可是恶魔的诅咒让罗盘指错了方向……</p>
      <p>创意与剧本：<span class="k">Trump</span>（11岁）。制作：S4 Family。</p>
      <p>免费、无广告、不收集任何数据、无需联网。</p>
      <p>字体：VT323、Fusion Pixel（SIL开源字体许可证）。</p>`
  }
};
TXT.vi.help = 'Cách chơi';
const $ = id => document.getElementById(id);
let mode = APP.mode, lang = APP.lang;
const names = Object.assign({}, APP.names);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fill = s => s.split('{T}').join(esc(names.trump)).split('{P}').join(esc(names.poly));
function render() {
  const t = TXT[lang], p = APP.progress();
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
  document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = fill(t[el.dataset.t] || ''); });
  $('sub').textContent = fill(t.sub).replace(/&amp;/g, '&');
  $('helpBody').innerHTML = fill(t.helpBody); $('aboutBody').innerHTML = fill(t.aboutBody);
  $('contLbl').textContent = CH[p.current].label;
  $('status').innerHTML = t.status.replace('{n}', p.unlocked) + (p.done ? '' : '  ·  ' + t.playing.replace('{c}', CH[p.current].label));
  $('done').classList.toggle('show', !!p.done);
  for (const b of $('seg').children) b.classList.toggle('on', +b.dataset.m === mode);
  for (const b of $('langs').children) b.classList.toggle('on', b.dataset.l === lang);
  const cards = $('cards'); cards.innerHTML = '';
  for (const n of [1, 2, 3]) {
    const c = document.createElement('button'); c.className = 'card m'; c.style.minWidth = '0';
    const st = n <= p.unlocked ? (n < p.unlocked || p.done ? t.passed : t.current) : t.locked;
    c.innerHTML = `<b>${CH[n].label}</b><span>${CH[n].name}</span><i>${st}</i>`;
    if (n > p.unlocked) c.setAttribute('disabled', ''); else c.onclick = () => play(n, 'new');
    cards.appendChild(c);
  }
}
const play = (n, start) => { APP.setProgress({ mode, current: n, pending: start }); location.href = `${CH[n].file}?mode=${mode}&start=${start}`; };
function setMode(m) { mode = m; APP.setProgress({ mode: m }); render(); }
// the language is read once per page: reload so the chapter names and game text switch too
function setLang(l) { if (l === lang) return; APP.setProgress({ lang: l }); location.reload(); }
for (const b of $('seg').children) b.onclick = () => setMode(+b.dataset.m);
for (const b of $('langs').children) b.onclick = () => setLang(b.dataset.l);
$('bContinue').onclick = () => { const p = APP.progress(); play(p.current, 'continue'); };
$('bNew').onclick = () => { const p = APP.progress(); if (p.unlocked > 1 || p.current > 1) open('pNew'); else play(1, 'new'); };
$('bNewGo').onclick = () => play(1, 'new');
$('bChapters').onclick = () => open('pChapters');
$('bNames').onclick = () => { $('nTrump').value = names.trump; $('nPoly').value = names.poly; open('pNames'); };
$('bHelp').onclick = () => open('pHelp');
$('bAbout').onclick = () => open('pAbout');
const clean = (v, d) => (v || '').replace(/[<>{}@]/g, '').replace(/\s+/g, ' ').trim().slice(0, 10) || d;
$('bNamesSave').onclick = () => {
  names.trump = clean($('nTrump').value, APP.DEFAULT_NAMES.trump); names.poly = clean($('nPoly').value, APP.DEFAULT_NAMES.poly);
  APP.setProgress({ names: { trump: names.trump, poly: names.poly } }); close(); render();
};
$('bNamesReset').onclick = () => { $('nTrump').value = APP.DEFAULT_NAMES.trump; $('nPoly').value = APP.DEFAULT_NAMES.poly; };
let openId = null;
function open(id) { close(); openId = id; $(id).classList.add('open'); focusFirst(); }
function close() { if (openId) $(openId).classList.remove('open'); openId = null; if (document.activeElement && document.activeElement.blur && document.activeElement.tagName === 'INPUT') document.activeElement.blur(); focusFirst(); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
document.querySelectorAll('.panel').forEach(p => p.addEventListener('click', e => { if (e.target === p) close(); }));
window.TRUMBO_HOME = { back() { if (openId) { close(); return true; } return false; } };

// keyboard / gamepad navigation between buttons
function focusables() { const scope = openId ? $(openId) : document; return Array.from(scope.querySelectorAll('button:not([disabled]),input')).filter(b => b.offsetParent !== null); }
function focusFirst() { const f = focusables(); if (f.length && usingPad) f[0].focus(); }
let usingPad = false;
function move(d) { const f = focusables(); if (!f.length) return; usingPad = true; let i = f.indexOf(document.activeElement); i = i < 0 ? 0 : (i + d + f.length) % f.length; f[i].focus(); }
const typing = () => document.activeElement && document.activeElement.tagName === 'INPUT';
addEventListener('keydown', e => {
  if (typing() && !['ArrowDown', 'ArrowUp', 'Escape', 'Enter', 'Tab'].includes(e.code)) return;
  if (['ArrowDown', 'ArrowRight', 'KeyS', 'KeyD'].includes(e.code) && !(typing() && e.code !== 'ArrowDown')) { move(1); e.preventDefault(); }
  if (['ArrowUp', 'ArrowLeft', 'KeyW', 'KeyA'].includes(e.code) && !(typing() && e.code !== 'ArrowUp')) { move(-1); e.preventDefault(); }
  if (e.code === 'Escape' && openId) close();
  if (e.code === 'Enter' && typing()) { $('bNamesSave').click(); e.preventDefault(); return; }
  if ((e.code === 'Enter' || e.code === 'KeyF' || e.code === 'Space') && document.activeElement && document.activeElement.tagName === 'BUTTON') { document.activeElement.click(); e.preventDefault(); }
});
// inputs need normal touch behaviour (the page blocks gestures elsewhere)
document.querySelectorAll('input').forEach(i => { i.style.touchAction = 'manipulation'; });
const prev = {};
(function poll() {
  requestAnimationFrame(poll);
  let pads = []; try { pads = Array.from(navigator.getGamepads ? navigator.getGamepads() : []).filter(Boolean); } catch (e) {}
  const now = {};
  for (const p of pads) {
    const bt = k => !!(p.buttons[k] && p.buttons[k].pressed);
    now.down = now.down || bt(13) || bt(15) || (p.axes[1] || 0) > 0.5 || (p.axes[0] || 0) > 0.5;
    now.up = now.up || bt(12) || bt(14) || (p.axes[1] || 0) < -0.5 || (p.axes[0] || 0) < -0.5;
    now.a = now.a || bt(0); now.b = now.b || bt(1);
  }
  if (now.down && !prev.down) move(1);
  if (now.up && !prev.up) move(-1);
  if (now.a && !prev.a && document.activeElement && document.activeElement.tagName === 'BUTTON') document.activeElement.click();
  if (now.b && !prev.b && openId) close();
  Object.assign(prev, now);
})();
if (!APP.progress().lang) APP.setProgress({ lang });
render();
if (new URLSearchParams(location.search).get('done')) $('done').classList.add('show');
})();
</script>
</body>
