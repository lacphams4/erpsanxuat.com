name: probe
on:
  push:
    branches: [claude/kind-mccarthy-pzyart]
    paths: ['.github/workflows/probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "ANDROID_HOME=$ANDROID_HOME" > probe.txt
          ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools >> probe.txt 2>&1 || true
          java -version >> probe.txt 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .ci && mv probe.txt .ci/probe.txt
          git add .ci/probe.txt && git commit -m "CI probe result" && git push
